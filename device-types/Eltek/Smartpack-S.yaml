comments: |
  Eltek Smartpack S controller as fitted in a Flatpack S 1U 48 V DC power system (the model name is what the controller reports over SNMP). From Eltek's Flatpack S 1U data sheet: 1U, 19 inch, 262 mm deep (300 mm cabinet depth recommended), 5.2 to 5.3 kg without rectifiers, 100-250 V AC input on rear terminal blocks, 48 V DC output, a controller with an Ethernet port, and room for 2 or 3 Flatpack S 48 V 1000 W rectifiers (40 A or 100 A in total).
  Module bays are the most any variant has: 3 rectifier slots (a 2R system fills two), 2 plug-in battery breakers and 7 load positions (a 3R system uses 2). Leave the unused ones empty. A real unit reported its rectifiers as "FLATPACK S 48/1800 HE", not the 1000 W in the data sheet, so check the rectifier type per site. The matching module types are in module-types/Eltek/.
  Not modelled: the controller's other inputs and outputs. If a site uses a different Eltek shelf, change the height.
