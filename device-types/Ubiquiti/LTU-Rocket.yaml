comments: |
  LTU is Ubiquiti's own radio protocol, so the radio is listed as 'other wireless'. From Ubiquiti's tech specs page.
  2 x GbE RJ45, no SFP. Passive PoE input on 4 pairs or 2 pairs, 18-54 V DC (24 V 1 A adapter included). No PoE passthrough is listed, so neither port is PoE out.
  Interface names follow real SNMP walks (eth0, ath0, br0). The second port is the MGMT port with secondary PoE in (Ubiquiti's product page); its SNMP name is not known (the walk reports only eth0, and a br2 bridge whose members are unknown), so 'mgmt' is a guess.
airflow: passive
interfaces:
  - name: br0
    type: bridge
    mgmt_only: true
  - name: eth0
    type: 1000base-t
    poe_mode: pd
    poe_type: passive-24v-4pair
  - name: mgmt
    label: MGMT
    type: 1000base-t
    mgmt_only: true
    description: "Secondary PoE in"
  - name: ath0
    type: other-wireless
power-ports:
  - name: PoE in
    type: other
    maximum_draw: 15
  - name: PoE in (MGMT)
    type: other
